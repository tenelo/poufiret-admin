<div class="page-mon-profil-admin">
  <h1>Mon profil</h1>
  <p class="sous-titre">Consultez et modifiez les informations de votre compte.</p>

  <app-carte-mon-compte [libelleRole]="libelleRole()" />

  @if (afficherDroits()) {
    <section class="section">
      <h2>Mes droits</h2>
      <p class="note-droits">
        Capacités accordées par l'administration — informatif, non modifiable ici.
      </p>
      <div class="grille-capacites">
        @for (entree of entreesCapacites(); track entree.cle) {
          <span class="chip-capacite" [class.chip-actif]="entree.valeur">
            <span class="icone-chip">{{ entree.valeur ? '✔' : '✖' }}</span>
            {{ entree.libelle }}
          </span>
        }
      </div>
    </section>
  }
</div>
