<nav class="barre-onglets" aria-label="Filtrer par statut">
  @for (onglet of onglets; track onglet.valeur) {
    <button
      type="button"
      class="onglet"
      [class.onglet-actif]="statut() === onglet.valeur"
      (click)="choisirOnglet(onglet.valeur)"
    >
      {{ onglet.libelle }}
      @if (compteur(onglet.valeur) !== null) {
        <span class="compteur">{{ compteur(onglet.valeur) }}</span>
      }
    </button>
  }
</nav>

<div class="filtres">
  <input
    type="search"
    class="champ-recherche"
    placeholder="Rechercher (titre ou partenaire)"
    aria-label="Rechercher une publicité"
    [value]="recherche()"
    (input)="saisirRecherche($any($event.target).value)"
  />

  <select aria-label="Filtrer par formule" (change)="choisirFormule($any($event.target).value)">
    <option value="" [selected]="formule() === ''">Toutes les formules</option>
    @for (f of formules(); track f.id) {
      <option [value]="f.id" [selected]="f.id === formule()">{{ f.nom }}</option>
    }
  </select>

  <select aria-label="Filtrer par portée" (change)="choisirPortee($any($event.target).value)">
    <option value="" [selected]="portee() === ''">Toutes les portées</option>
    @for (option of optionsPortee; track option.valeur) {
      <option [value]="option.valeur" [selected]="option.valeur === portee()">
        {{ option.libelle }}
      </option>
    }
  </select>

  <button type="button" class="bouton-reinitialiser" (click)="reinitialiser()">Réinitialiser</button>
</div>

@if (partenaireActif(); as partenaire) {
  <div class="pastille-partenaire">
    <span>Partenaire : {{ partenaire.nom }}</span>
    <button type="button" (click)="retirerPartenaire()" aria-label="Retirer le filtre partenaire">✕</button>
  </div>
}

<details class="plus-de-filtres">
  <summary>Plus de filtres (période, origine)</summary>
  <div class="grille-plus-filtres">
    <div class="champ-periode">
      <label for="fpa-date-debut">Du</label>
      <input
        id="fpa-date-debut"
        type="date"
        [value]="dateDebut()"
        (change)="changerDateDebut($any($event.target).value)"
      />
    </div>
    <div class="champ-periode">
      <label for="fpa-date-fin">Au</label>
      <input
        id="fpa-date-fin"
        type="date"
        [value]="dateFin()"
        (change)="changerDateFin($any($event.target).value)"
      />
    </div>

    <fieldset class="choix-origine">
      <legend>Origine</legend>
      @for (option of optionsOrigine; track option.valeur) {
        <label class="option-origine">
          <input
            type="checkbox"
            [checked]="origineCochee(option.valeur)"
            (change)="basculerOrigine(option.valeur, $any($event.target).checked)"
          />
          {{ option.libelle }}
        </label>
      }
    </fieldset>
  </div>
</details>
