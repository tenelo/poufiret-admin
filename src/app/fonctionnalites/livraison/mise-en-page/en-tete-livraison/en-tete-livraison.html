<header class="en-tete-livraison">
  <span class="nom-app">TeneLivr</span>

  <div class="zone-utilisateur">
    @if (utilisateur()) {
      @if (nomBureau()) {
        <span class="bureau">{{ nomBureau() }}</span>
      }
      <span class="telephone">{{ nomAffiche() }}</span>
      <span class="role">{{ libelleNiveau() }}</span>
    }
    <button type="button" (click)="deconnexion()">Déconnexion</button>
  </div>
</header>
