@if (role() === 'partenaire') {
  <app-tableau-de-bord-partenaire />
} @else if (role() === 'admin') {
  <app-tableau-de-bord-admin />
} @else {
  <section class="tableau-de-bord">
    @if (utilisateur(); as u) {
      <h1>Bonjour {{ u.first_name || u.telephone }}</h1>
    }
    <p>Le contenu du tableau de bord sera ajouté prochainement.</p>
  </section>
}
