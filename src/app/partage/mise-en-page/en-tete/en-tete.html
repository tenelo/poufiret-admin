<header class="en-tete">
  <div class="zone-gauche">
    <button
      type="button"
      class="bouton-menu"
      aria-label="Ouvrir ou fermer le menu"
      aria-controls="menu-lateral"
      [attr.aria-expanded]="menuOuvert()"
      (click)="menuBascule.emit()"
    >
      ☰
    </button>
    <span class="nom-app">ADMINISTRATION</span>
  </div>

  <div class="zone-utilisateur">
    @if (estPartenaire()) {
      <app-cloche-notifications />
    }
    @if (utilisateur()) {
      <span class="telephone">{{ nomAffiche() }}</span>
      <span class="role" [class.role-superadmin]="estSuperadmin()">{{ libelleRole() }}</span>
    }
    <button type="button" (click)="deconnexion()">Déconnexion</button>
  </div>
</header>
