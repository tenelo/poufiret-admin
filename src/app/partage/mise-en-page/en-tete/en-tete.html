<header class="en-tete">
  <span class="nom-app">Poufiret</span>

  <div class="zone-utilisateur">
    @if (estPartenaire()) {
      <app-cloche-notifications />
    }
    @if (utilisateur()) {
      <span class="telephone">{{ nomAffiche() }}</span>
      <span class="role" [class.role-superadmin]="estSuperadmin()">{{ libelleRole() }}</span>
    }
    <button type="button" (click)="deconnexion()">Déconnexion</button>
  </div>
</header>
