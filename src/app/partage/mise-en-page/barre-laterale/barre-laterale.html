<nav class="barre-laterale">
  <ul>
    @for (entree of entrees(); track entree.libelle) {
      <li>
        @if (entree.lien) {
          <a [routerLink]="entree.lien" routerLinkActive="actif">{{ entree.libelle }}</a>
        } @else {
          <span class="placeholder">{{ entree.libelle }} <em>(à venir)</em></span>
        }
      </li>
    }
  </ul>
</nav>
