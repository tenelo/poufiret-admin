<div class="trois-cloches">
  <!-- Cloche "Restaurants" (canal restaurant) : commandes de restaurants, fast-foods, grilleurs, boulangeries -->
  <app-cloche-canal
    classeCouleur="cloche-restaurant"
    libelleAccessibilite="notification Restaurants"
    titrePanneau="Restaurants"
    [nbNonLues]="nbNonLuesRestaurant()"
    [texteBadge]="texteBadge(nbNonLuesRestaurant())"
    [enAnimation]="enAnimation()"
    [panneauOuvert]="panneauOuvertRestaurant()"
    [chargementEnCours]="chargementRestaurant()"
    [erreur]="erreurRestaurant()"
    [notifications]="notificationsRestaurant()"
    (bascule)="basculerPanneau('restaurant')"
    (toutLire)="toutMarquerCommeLu('restaurant')"
    (ouvrir)="ouvrirNotification($event)"
  />

  <!-- Cloche "Services" (canal service) : demandes d'intervention et de location -->
  <app-cloche-canal
    classeCouleur="cloche-service"
    libelleAccessibilite="notification Services"
    titrePanneau="Services"
    [nbNonLues]="nbNonLuesService()"
    [texteBadge]="texteBadge(nbNonLuesService())"
    [enAnimation]="enAnimation()"
    [panneauOuvert]="panneauOuvertService()"
    [chargementEnCours]="chargementService()"
    [erreur]="erreurService()"
    [notifications]="notificationsService()"
    (bascule)="basculerPanneau('service')"
    (toutLire)="toutMarquerCommeLu('service')"
    (ouvrir)="ouvrirNotification($event)"
  />

  <!-- Cloche "Autres" (canal general) : tout le reste (pub, autres commandes, changements de numéro) -->
  <app-cloche-canal
    classeCouleur="cloche-generale"
    libelleAccessibilite="notification Autres"
    titrePanneau="Autres"
    [nbNonLues]="nbNonLuesGeneral()"
    [texteBadge]="texteBadge(nbNonLuesGeneral())"
    [enAnimation]="enAnimation()"
    [panneauOuvert]="panneauOuvertGeneral()"
    [chargementEnCours]="chargementGeneral()"
    [erreur]="erreurGeneral()"
    [notifications]="notificationsGeneral()"
    (bascule)="basculerPanneau('general')"
    (toutLire)="toutMarquerCommeLu('general')"
    (ouvrir)="ouvrirNotification($event)"
  />

  @if (sonBloque()) {
    <button type="button" class="bouton-activer-son" (click)="activerSon()">🔇 Activer le son</button>
  }

  <app-etat-notifications-push class="bloc-push" />
</div>
