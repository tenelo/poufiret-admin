<div class="deux-cloches">
  <!-- Cloche "Restaurants" (canal restaurant) : commandes de restaurants uniquement -->
  <app-cloche-canal
    icone="🍽️"
    libelleAccessibilite="notification Restaurants"
    titrePanneau="Restaurants"
    [nbNonLues]="nbNonLuesRestaurant()"
    [texteBadge]="texteBadge(nbNonLuesRestaurant())"
    [enAnimation]="enAnimation()"
    [panneauOuvert]="panneauOuvertRestaurant()"
    [chargementEnCours]="chargementRestaurant()"
    [erreur]="erreurRestaurant()"
    [notifications]="notificationsRestaurant()"
    (bascule)="basculerPanneau('restaurant')"
    (toutLire)="toutMarquerCommeLu('restaurant')"
    (ouvrir)="ouvrirNotification($event)"
  />

  <!-- Cloche "Général" (canal general) : tout le reste (pub, autres commandes, locations, interventions) -->
  <app-cloche-canal
    icone="🔔"
    classeCouleur="cloche-generale"
    libelleAccessibilite="notification générale"
    titrePanneau="Général"
    [nbNonLues]="nbNonLuesGeneral()"
    [texteBadge]="texteBadge(nbNonLuesGeneral())"
    [enAnimation]="enAnimation()"
    [panneauOuvert]="panneauOuvertGeneral()"
    [chargementEnCours]="chargementGeneral()"
    [erreur]="erreurGeneral()"
    [notifications]="notificationsGeneral()"
    (bascule)="basculerPanneau('general')"
    (toutLire)="toutMarquerCommeLu('general')"
    (ouvrir)="ouvrirNotification($event)"
  />

  <audio #lecteurAudio [src]="cheminSon" preload="auto"></audio>
</div>
